apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web-tests
  description: The status page's tests (the compacted state, the scheduled checker against SQLite, the API routes, the password gate and the client-safe props), run on every pull request
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  domain: tests
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
